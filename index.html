  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#163b30">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
    html { height: 100%; }
    body { height: 100%; min-height: -webkit-fill-available; margin: 0; background: #f6f1e7; font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    #root { height: 100%; height: 100dvh; display: flex; align-items: center; justify-content: center; background: #163b30; }
    .app { position: relative; width: 100%; max-width: 430px; height: 100%; max-height: 900px; background: #f6f1e7; overflow: hidden; display: flex; flex-direction: column; }
    @media (max-width: 480px) { .app { max-width: 100%; max-height: 100%; max-height: 100dvh; } #root { background: #f6f1e7; } }
    .s::-webkit-scrollbar { display: none; }
    .s { scrollbar-width: none; -ms-overflow-style: none; overscroll-behavior: contain; }
    @keyframes fu { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes su { from { transform:translateY(100%); } to { transform:none; } }
    @keyframes po { from { opacity:0; transform:scale(.96); } to { opacity:1; transform:scale(1); } }
    @keyframes toast-in { from { opacity:0; transform:translateY(-14px) scale(.95); } to { opacity:1; transform:none; } }
    .afu { animation: fu .4s ease both; }
    .apo { animation: po .3s ease both; }
    .asu { animation: su .32s cubic-bezier(.2,.8,.2,1) both; }
    input, textarea, select { font-family: 'Hanken Grotesk', system-ui, sans-serif; }
    a { text-decoration: none; color: inherit; display: contents; }
    @keyframes notif-in { from { opacity:0; transform:translateY(-16px); } to { opacity:1; transform:none; } }
    @media (display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui) {
      .abi-statusbar { display: none !important; }
      .app { padding-top: env(safe-area-inset-top, 0px); }
      .abi-nav { padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)) !important; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script src="./vendor/react.min.js"></script>
<script src="./vendor/react-dom.min.js"></script>
<script src="./vendor/lottie.min.js"></script>
<script src="./app.js"></script>
</body>
</html>
