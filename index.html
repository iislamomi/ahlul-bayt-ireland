/* ── HIJRI DATE ── */
function toHijri(date) {
  const y = date.getFullYear(), m = date.getMonth()+1, d = date.getDate();
  let yy = y, mm = m;
  if (mm <= 2) { yy--; mm += 12; }
  const A = Math.floor(yy/100);
  const B = 2 - A + Math.floor(A/4);
  const jd = Math.floor(Math.floor(365.25*(yy+4716)) + Math.floor(30.6001*(mm+1)) + d + B - 1524.5 + 0.5);
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = Math.floor((10985-l)/5316)*Math.floor((50*l)/17719)
          + Math.floor(l/5670)*Math.floor((43*l)/15238);
  l = l - Math.floor((30-j)/15)*Math.floor((17719*j)/50)
        - Math.floor(j/16)*Math.floor((15238*j)/43) + 29;
  const hm = Math.floor((24*l)/709);
  const hd = l - Math.floor((709*hm)/24);
  const hy = 30*n + j - 30;
  const M = ['Muḥarram','Ṣafar','Rabīʿ al-Awwal','Rabīʿ al-Thānī','Jumādā al-Ūlā','Jumādā al-Ākhira',
             'Rajab','Shaʿbān','Ramaḍān','Shawwāl','Dhū al-Qaʿda','Dhū al-Ḥijja'];
  return `${hd} ${M[hm-1]} ${hy}`;
}

/* ── CUSTOM SELECT ── */
class CustomSelect extends Component {
  state = { open: false };
  close = () => this.setState({ open: false });

  componentDidMount() { document.addEventListener('click', this.close); }
  componentWillUnmount() { document.removeEventListener('click', this.close); }

  render() {
    const { value, options, onChange, muted } = this.props;
    const { open } = this.state;
    return (
      <div style={{position:'relative'}} onClick={e=>e.stopPropagation()}>
        <div
          onClick={()=>this.setState(s=>({open:!s.open}))}
          style={{border:`1px solid ${open?'#1f5145':'#e6dcc8'}`,background:'#fffdf9',borderRadius:13,padding:'13px 15px',fontSize:15,color:muted?'#a89d88':'#2c2823',display:'flex',justifyContent:'space-between',alignItems:'center',cursor:'pointer',userSelect:'none'}}
        >
          <span>{value}</span>
          <span style={{color:'#b3a890',fontSize:11,marginLeft:8,transform:open?'rotate(180deg)':'none',transition:'transform .15s'}}>▾</span>
        </div>
        {open && (
          <div style={{position:'absolute',top:'calc(100% + 4px)',left:0,right:0,background:'#fffdf9',border:'1px solid #e6dcc8',borderRadius:13,zIndex:30,overflow:'hidden',boxShadow:'0 8px 24px rgba(0,0,0,.1)'}}>
            {options.map(opt => (
              <div
                key={opt}
                onClick={()=>{ onChange(opt); this.setState({open:false}); }}
                style={{padding:'12px 15px',fontSize:14.5,color:opt===value?'#1f5145':'#2c2823',fontWeight:opt===value?600:400,background:opt===value?'#f3f7f4':'transparent',cursor:'pointer'}}
              >
                {opt}
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }
}

    screen: 'home', libTab: 'dua', nahjTab: 'sermons', prayerTab: 'today',

    story: null, storyProg: 0,
    adminForm: null, adminTitle: '', adminContent: '', adminExpiry: '24 hours', adminLink: 'None', adminCat: 'Food',
    classCat: 'All', libCat: 'All',
    now: new Date(), install: true,
    libQuery: '', classQuery: '',
    readingType: null, readingItem: null,
    toast: null, bookmarks: [],
  };

  componentDidMount() {
    this.clockTimer = setInterval(() => this.setState({ now: new Date() }), 1000);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      this.deferredPrompt = e;
    });
    window.addEventListener('appinstalled', () => {
      this.setState({ install: false });
      this.deferredPrompt = null;
    });
  }

  componentWillUnmount() {
    clearInterval(this.clockTimer);
    clearInterval(this.storyTimer);
  }

  go = s => this.setState({ screen: s, story: null });
  openReading = (type, item) => this.setState({ screen: 'reading', readingType: type, readingItem: item });

  showToast = msg => {
    this.setState({ toast: msg });
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), 2600);
  };

  handleInstall = () => {
    if (this.deferredPrompt) {
      this.deferredPrompt.prompt();
      this.deferredPrompt.userChoice.then(() => {
        this.deferredPrompt = null;
        this.setState({ install: false });
      });
    } else {
      this.go('about');
    }
  };

  handleShare = () => {
    const r = this.state.readingItem || {};
    const text = r.body || r.tr || '';
    if (navigator.share) {
      navigator.share({ title: r.title, text, url: window.location.href }).catch(() => {});
    } else if (navigator.clipboard) {
      navigator.clipboard.writeText(text).then(() => this.showToast('Copied to clipboard'));
    } else {
      this.showToast('Share not available on this device');
    }
  };

  handleBookmark = () => {
    const r = this.state.readingItem;
    if (!r) return;
    const bm = this.state.bookmarks;
    const exists = bm.some(b => b.title === r.title);
    if (exists) {
      this.setState({ bookmarks: bm.filter(b => b.title !== r.title) });
      this.showToast('Bookmark removed');
    } else {
      this.setState({ bookmarks: [...bm, r] });
      this.showToast('Bookmarked');
    }
  };

  handlePDF = () => {
    this.showToast('Opening prayer calendar…');
    setTimeout(() => window.open('https://ahlulbaytireland.com/prayer-calendar.pdf', '_blank'), 300);
  };

  openStory = i => {
    clearInterval(this.storyTimer);
    this.setState({ story: i, storyProg: 0 });
    this.storyTimer = setInterval(() => {
      this.setState(st => {
        if (st.story === null) return {};
        const np = st.storyProg + 1.6;
        if (np >= 100) {
          if (st.story < STORIES.length - 1) return { story: st.story + 1, storyProg: 0 };
          clearInterval(this.storyTimer);
          return { story: null, storyProg: 0 };
        }
        return { storyProg: np };
      });
    }, 60);
  };

  closeStory = () => { clearInterval(this.storyTimer); this.setState({ story: null, storyProg: 0 }); };
  prevStory  = () => { if (this.state.story > 0) this.openStory(this.state.story - 1); };
  nextStory  = () => { if (this.state.story < STORIES.length - 1) this.openStory(this.state.story + 1); else this.closeStory(); };

  toMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }

  computeNext() {
    const now = this.state.now;
    const mins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
    const order = PRAYERS.filter(p => ['Fajr','Dhuhr','Maghrib','Midnight'].includes(p.name));
    let next = order.find(p => this.toMin(p.time) > mins);
    let addDay = false;
    if (!next) { next = order[0]; addDay = true; }
    const diff = this.toMin(next.time) - mins + (addDay ? 1440 : 0);
    const h = Math.floor(diff/60), m = Math.floor(diff%60), s = Math.floor((diff*60)%60);
    const cd = h > 0 ? `${h}h ${String(m).padStart(2,'0')}m` : `${m}m ${String(s).padStart(2,'0')}s`;
    return { next, cd };
  }

  /* ── PRAYER ── */
  renderPrayer(st, next, cd, greg) {
    const tab = st.prayerTab;
    const prayers = PRAYERS.map((p,i) => ({
      ...p, isNext: p.name===next.name, last: i===PRAYERS.length-1
    }));
    const monthRows = Array.from({length:8},(_,i) => ({
      day:`${i+18} Jun`,
      fajr:['03:28','03:29','03:29','03:30','03:31','03:32','03:33','03:34'][i],
      dhuhr:'13:26',
      maghrib:['22:16','22:16','22:17','22:17','22:17','22:18','22:18','22:18'][i],
      today: i===0,
    }));
    const tabStyle = active => ({
      flex:1, textAlign:'center', padding:9, borderRadius:10,
      fontSize:13.5, fontWeight:600, cursor:'pointer',
      background: active ? '#fffdf9' : 'transparent',
      color: active ? '#1f5145' : '#8c8270',
      boxShadow: active ? '0 2px 6px rgba(40,30,10,.08)' : 'none',
    });
    return (
      <div style={{padding:'8px 20px 100px'}} className="afu">
        <div style={{padding:'8px 0 16px'}}>
          <div style={{fontSize:13,color:'#9a8f7c',fontWeight:500}}>{greg}</div>
          <div style={{fontFamily:'Spectral,serif',fontSize:26,fontWeight:600,color:'#27241f',marginTop:2}}>Prayer Times</div>
        </div>

        <div style={{display:'flex',gap:6,background:'#efe7d7',borderRadius:14,padding:4,marginBottom:18}}>
          <div onClick={()=>this.setState({prayerTab:'today'})} style={tabStyle(tab==='today')}>Today</div>
          <div onClick={()=>this.setState({prayerTab:'month'})} style={tabStyle(tab==='month')}>Monthly</div>
        </div>

        {tab==='today' && <>
          <div style={{background:'linear-gradient(155deg,#1f5145,#163b30)',borderRadius:22,padding:22,color:'#f3ead4',textAlign:'center',boxShadow:'0 18px 34px -18px rgba(22,59,48,.7)',marginBottom:18,position:'relative',overflow:'hidden'}}>
            <div style={{position:'absolute',left:'50%',top:-40,transform:'translateX(-50%)',width:200,height:200,borderRadius:'50%',border:'1px solid rgba(216,184,99,.16)'}} />
            <div style={{position:'relative'}}>
              <div style={{fontSize:11,letterSpacing:1.5,textTransform:'uppercase',color:'#d8b863',fontWeight:600}}>{next.name} begins in</div>
              <div style={{fontSize:46,fontWeight:700,fontVariantNumeric:'tabular-nums',margin:'8px 0 4px',letterSpacing:1}}>{cd}</div>
              <div style={{fontFamily:'Amiri,serif',fontSize:20,color:'#cdbf9e'}} dir="rtl">{next.ar} · {next.time}</div>
            </div>
          </div>
          <div style={{background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:20,overflow:'hidden',marginBottom:16}}>
            {prayers.map(p => (
              <div key={p.name} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 18px',borderBottom:p.last?'none':'1px solid #f1ebdd',background:p.isNext?'linear-gradient(90deg,#f3f7f4,#fffdf9)':'transparent'}}>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                  <span style={{fontFamily:'Amiri,serif',fontSize:21,color:p.isNext?'#1f5145':'#c2a86a',width:30,textAlign:'center'}} dir="rtl">{p.glyph}</span>
                  <div>
                    <div style={{fontSize:16.5,color:p.isNext?'#1f5145':'#3f3a32',fontWeight:p.isNext?700:500}}>{p.name}</div>
                    <div style={{fontSize:11.5,color:'#a89d88',marginTop:1}}>{p.en}</div>
                  </div>
                </div>
                <span style={{fontSize:18,color:p.isNext?'#1f5145':'#3f3a32',fontWeight:p.isNext?700:500,fontVariantNumeric:'tabular-nums'}}>{p.time}</span>
              </div>
            ))}
          </div>

        {tab==='month' && (
          <div style={{background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:20,overflow:'hidden',marginBottom:16}}>
            <div style={{display:'flex',padding:'11px 16px',background:'#f4eee0',fontSize:10.5,letterSpacing:.6,textTransform:'uppercase',color:'#a2967f',fontWeight:700}}>
              <div style={{width:56,flexShrink:0}}>Date</div>
              <div style={{flex:1,textAlign:'center'}}>Fajr</div>
              <div style={{flex:1,textAlign:'center'}}>Dhuhr</div>
              <div style={{flex:1,textAlign:'center'}}>Maghrib</div>
            </div>
            {monthRows.map((m,i) => (
              <div key={i} style={{display:'flex',padding:'13px 16px',borderBottom:i===monthRows.length-1?'none':'1px solid #f1ebdd',fontSize:13.5,color:'#4a443a',fontVariantNumeric:'tabular-nums',background:m.today?'#f3f7f4':'transparent'}}>
                <div style={{width:56,flexShrink:0,fontWeight:600,color:m.today?'#1f5145':'#4a443a'}}>{m.day}</div>
                <div style={{flex:1,textAlign:'center'}}>{m.fajr}</div>
                <div style={{flex:1,textAlign:'center'}}>{m.dhuhr}</div>
                <div style={{flex:1,textAlign:'center'}}>{m.maghrib}</div>

        <div onClick={this.handlePDF} style={{display:'flex',alignItems:'center',gap:12,background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:16,padding:'15px 16px',cursor:'pointer',marginBottom:14}}>
          <div style={{width:36,height:36,borderRadius:10,background:'#f0e7d3',display:'flex',alignItems:'center',justifyContent:'center',color:'#9a7a2c',fontWeight:700,fontSize:11}}>PDF</div>
          <div style={{flex:1}}>
            <div style={{fontSize:14,fontWeight:600,color:'#2c2823'}}>Yearly prayer calendar</div>
            <div style={{fontSize:11.5,color:'#9a8f7c',marginTop:1}}>Download the full 1447 timetable</div>
          </div>
          <span style={{color:'#bba35f',fontSize:20}}>↓</span>
        </div>
        <div style={{textAlign:'center',fontSize:11.5,color:'#a89d88',lineHeight:1.5,padding:'6px 20px'}}>
          Following Ahlul-Bait Ireland prayer timing.<br/>Times calculated for Dublin, Ireland.
        </div>
      </div>
    );
  }

  /* ── LIBRARY ── */
  renderLibrary(st) {
    const q = st.libQuery.trim().toLowerCase();
    const libMeta = {
      dua:     { title:"Duʿāʾ",         accent:'#9a7a2c', tint:'#f3ecd9', list:DUAS,    cats:['All','Daily','Weekly','Morning','Monthly'] },
      ziyarah: { title:'Ziyārah',        accent:'#6e2230', tint:'#f3e6e8', list:ZIYARAT, cats:['All','Imam Ḥusayn',"The Aʾimmah",'General'] },
      nahj:    { title:'Nahj al-Balāgha',accent:'#2c5d52', tint:'#e6efe9', list:[],      cats:[] },
    };
    const lm = libMeta[st.libTab];
    const tabStyle = k => ({
      flex:1, textAlign:'center', padding:10, borderRadius:12, fontSize:13.5, fontWeight:600,
      cursor:'pointer', border:'1px solid #ece4d4',
      background: st.libTab===k ? lm.accent : 'transparent',
      color: st.libTab===k ? '#fffdf9' : '#6f675a',
    });
    const chipStyle = c => {
      const active = st.libCat===c;
      return {
        flexShrink:0, padding:'8px 15px', borderRadius:20, fontSize:12.5, fontWeight:600,
        cursor:'pointer', transition:'all .15s',
        background: active ? lm.accent : '#fffdf9',
        color: active ? '#fffdf9' : '#6f675a',
        border: `1px solid ${active ? lm.accent : '#e6dcc8'}`,
      };
    };
    let libCards = [];
    if (st.libTab==='dua' || st.libTab==='ziyarah') {
      libCards = lm.list.filter(it => {
        const catOk = st.libCat==='All' || it.cat===st.libCat;
        const qOk = !q || it.title.toLowerCase().includes(q) || it.tr.toLowerCase().includes(q);
        return catOk && qOk;
      });
    }
    let nahjCards = [];
    if (st.libTab==='nahj') {
      nahjCards = NAHJ[st.nahjTab].filter(it =>
        !q || it.title.toLowerCase().includes(q) || it.tr.toLowerCase().includes(q)
      );
    }
    const nahjTabStyle = k => ({
      padding:'0 0 11px', fontSize:14, cursor:'pointer', marginBottom:-1,
      fontWeight: st.nahjTab===k ? 700 : 500,
      color: st.nahjTab===k ? '#2c5d52' : '#8c8270',
      borderBottom: st.nahjTab===k ? '2px solid #2c5d52' : '2px solid transparent',
    });
    return (
      <div style={{padding:'8px 20px 100px'}} className="afu">
        <div style={{padding:'8px 0 14px'}}>
          <div style={{fontSize:13,color:'#9a8f7c',fontWeight:500}}>Library</div>
          <div style={{fontFamily:'Spectral,serif',fontSize:26,fontWeight:600,color:'#27241f',marginTop:2}}>{lm.title}</div>
        </div>

        <div style={{display:'flex',gap:8,marginBottom:16}}>
          {[['dua',"Duʿāʾ"],['ziyarah','Ziyārah'],['nahj','Nahj']].map(([k,label]) => (
            <div key={k} onClick={()=>this.setState({libTab:k,libQuery:'',libCat:'All'})} style={tabStyle(k)}>{label}</div>
          ))}
        </div>

        <div style={{display:'flex',alignItems:'center',gap:10,background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:14,padding:'11px 14px',marginBottom:14}}>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#b3a890" strokeWidth="2" strokeLinecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
          <input value={st.libQuery} onChange={e=>this.setState({libQuery:e.target.value})} placeholder="Search titles & translations" style={{border:'none',outline:'none',background:'transparent',fontSize:14,color:'#3f3a32',width:'100%'}} />
          {st.libQuery && <div onClick={()=>this.setState({libQuery:''})} style={{color:'#b3a890',cursor:'pointer',fontSize:18,lineHeight:1}}>×</div>}
        </div>

        {lm.cats.length > 0 && (
          <div className="s" style={{display:'flex',gap:8,overflowX:'auto',margin:'0 -20px 16px',padding:'0 20px 2px'}}>
            {lm.cats.map(c => (
              <div key={c} onClick={()=>this.setState({libCat:c})} style={chipStyle(c)}>{c}</div>
            ))}
          </div>
        )}

        {st.libTab==='nahj' && (
          <div style={{display:'flex',gap:22,borderBottom:'1px solid #ece4d4',marginBottom:16}}>
            {[['sermons','Sermons'],['letters','Letters'],['sayings','Sayings']].map(([k,label]) => (
              <div key={k} onClick={()=>this.setState({nahjTab:k})} style={nahjTabStyle(k)}>{label}</div>
            ))}
          </div>
        )}

        {libCards.length > 0 && (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {libCards.map((d,i) => (
              <div key={i} onClick={()=>this.openReading(st.libTab,d)} style={{background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:18,padding:'16px 17px',cursor:'pointer'}}>
                <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:9}}>
                  <span style={{fontSize:10.5,letterSpacing:.8,textTransform:'uppercase',fontWeight:700,color:lm.accent,background:lm.tint,padding:'4px 9px',borderRadius:7}}>{d.cat}</span>
                  <span style={{color:'#cdbf9e',fontSize:18}}>→</span>
                </div>
                <div style={{fontFamily:'Spectral,serif',fontSize:18,fontWeight:600,color:'#2c2823'}}>{d.title}</div>
                <div style={{fontFamily:'Amiri,serif',fontSize:19,color:'#6f675a',marginTop:7,lineHeight:1.7}} dir="rtl">{d.ar}</div>
                <div style={{fontSize:13,color:'#9a8f7c',marginTop:6,lineHeight:1.45}}>{d.tr}</div>
              </div>
            ))}
          </div>
        )}

        {nahjCards.length > 0 && (
          <div style={{display:'flex',flexDirection:'column',gap:12}}>
            {nahjCards.map((n,i) => (
              <div key={i} onClick={()=>this.openReading('nahj',n)} style={{background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:18,padding:'16px 17px',cursor:'pointer'}}>
                <div style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
                  <span style={{fontSize:11,letterSpacing:.6,textTransform:'uppercase',fontWeight:700,color:'#2c5d52'}}>{n.ref}</span>
                  <span style={{color:'#cdbf9e',fontSize:18}}>→</span>
                </div>
                <div style={{fontFamily:'Spectral,serif',fontSize:18,fontWeight:600,color:'#2c2823',marginTop:5}}>{n.title}</div>
                <div style={{fontSize:13.5,color:'#7a7264',marginTop:7,lineHeight:1.5}}>{n.tr}</div>
                {n.sum && <div style={{fontSize:12,color:'#9a8f7c',marginTop:9,paddingTop:9,borderTop:'1px solid #f1ebdd',fontStyle:'italic'}}>{n.sum}</div>}
              </div>
            ))}
          </div>
        )}

        {libCards.length===0 && nahjCards.length===0 && (q || st.libCat!=='All') && (
          <div style={{textAlign:'center',padding:'40px 20px',color:'#9a8f7c',fontSize:14}}>
            {q ? `No results for "${st.libQuery}"` : `No items in "${st.libCat}"`}
          </div>
        )}
      </div>
    );
  }

  /* ── READING ── */
  renderReading(st) {
    const dark = st.dark;
    const r = st.readingItem || {};
    const rtype = st.readingType;
    const rd = dark
      ? { bg:'#16191a', surf:'#1e2324', text:'#ece6d8', muted:'#8e9490', border:'#2c3234', barBg:'rgba(22,25,26,.9)', accent:'#d8b863', arInk:'#e9e1cd' }
      : { bg:'#f6f1e7', surf:'#fffdf9', text:'#2c2823', muted:'#9a8f7c', border:'#ece4d4', barBg:'rgba(246,241,231,.92)', accent:'#1f5145', arInk:'#2c2823' };
    const arSize = Math.round(30 * st.textSize) + 'px';
    const trSize = Math.round(17 * st.textSize) + 'px';
    const readAccent = rtype==='ziyarah' ? '#6e2230' : rtype==='nahj' ? '#2c5d52' : '#9a7a2c';
    const kicker = rtype==='dua' ? 'Supplication' : rtype==='ziyarah' ? 'Salutation' : (r.ref || 'Nahj al-Balāgha');
    const isBookmarked = st.bookmarks.some(b => b.title === r.title);
    return (
      <div style={{minHeight:'100%',background:rd.bg}}>
        <div style={{position:'sticky',top:0,zIndex:4,background:rd.barBg,backdropFilter:'blur(12px)',borderBottom:`1px solid ${rd.border}`,padding:'12px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
          <div onClick={()=>this.setState({screen:'library'})} style={{display:'flex',alignItems:'center',gap:5,cursor:'pointer',color:rd.accent,fontSize:14,fontWeight:600}}>
            <span style={{fontSize:18}}>‹</span> Library
          </div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <div onClick={()=>this.setState(s=>({textSize:Math.max(.85,s.textSize-.12)}))} style={{width:34,height:34,borderRadius:10,border:`1px solid ${rd.border}`,display:'flex',alignItems:'center',justifyContent:'center',color:rd.text,fontSize:13,cursor:'pointer',background:rd.surf}}>A−</div>
            <div onClick={()=>this.setState(s=>({textSize:Math.min(1.5,s.textSize+.12)}))} style={{width:34,height:34,borderRadius:10,border:`1px solid ${rd.border}`,display:'flex',alignItems:'center',justifyContent:'center',color:rd.text,fontSize:17,cursor:'pointer',background:rd.surf}}>A+</div>
            <div onClick={()=>this.setState(s=>({dark:!s.dark}))} style={{width:34,height:34,borderRadius:10,border:`1px solid ${rd.border}`,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',background:rd.surf}}>
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke={rd.accent} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M20 14a8 8 0 1 1-9.8-9.6A6.5 6.5 0 0 0 20 14z"/></svg>
            </div>
          </div>
        </div>

        <div style={{padding:'22px 22px 100px'}} className="afu">

            <div key={i} style={{display:'flex',gap:12,padding:'13px 0',borderBottom:i===activity.length-1?'none':'1px solid #f3ecdd'}}>
              <span style={{flexShrink:0,width:8,height:8,borderRadius:'50%',background:a.dot,marginTop:5}} />
              <div>
                <div style={{fontSize:13.5,color:'#3f3a32',lineHeight:1.4}}>{a.txt}</div>
                <div style={{fontSize:11.5,color:'#a89d88',marginTop:2}}>{a.meta}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  /* ── ADMIN FORM ── */
  renderAdminForm(st) {
    const af = st.adminForm || 'Story';
    const isStory = af==='Story';
    const isClass = af==='Classified';
    const canPublish = st.adminTitle.trim().length > 0 && st.adminContent.trim().length > 0;

    const handlePublish = () => {
      if (!canPublish) { this.showToast('Fill in title and content first'); return; }
      this.showToast(`${af} published!`);
      setTimeout(() => this.go('admin'), 1200);
    };
    const handleDraft = () => {
      if (!st.adminTitle.trim()) { this.showToast('Enter a title to save draft'); return; }
      this.showToast('Draft saved');
    };

    return (
      <div style={{position:'absolute',inset:0,zIndex:18,background:'#f6f1e7',display:'flex',flexDirection:'column'}} className="asu">
        <div style={{flexShrink:0,padding:'54px 20px 14px',background:'#fffdf9',borderBottom:'1px solid #ece4d4'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div onClick={()=>this.go('admin')} style={{fontSize:14,color:'#8c8270',fontWeight:600,cursor:'pointer'}}>Cancel</div>
            <div style={{fontSize:15,fontWeight:600,color:'#27241f'}}>New {af}</div>
            <div onClick={handlePublish} style={{fontSize:14,color:canPublish?'#1f5145':'#b3a890',fontWeight:700,cursor:'pointer'}}>Publish</div>
          </div>
        </div>
        <div className="s" style={{flex:1,overflowY:'auto',padding:20}}>
          <div style={{display:'flex',gap:8,marginBottom:20}}>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:.5,textTransform:'uppercase',color:'#9a7a2c',background:'#f3ecd9',padding:'6px 11px',borderRadius:8}}>Draft</span>
            <span style={{fontSize:11,fontWeight:700,letterSpacing:.5,textTransform:'uppercase',color:'#8c8270',background:'#efe7d7',padding:'6px 11px',borderRadius:8}}>Not published</span>
          </div>

          <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>Title</label>
          <input
            value={st.adminTitle}
            onChange={e=>this.setState({adminTitle:e.target.value})}
            placeholder="Enter a clear title"
            style={{width:'100%',border:'1px solid #e6dcc8',background:'#fffdf9',borderRadius:13,padding:'13px 15px',fontSize:15,color:'#2c2823',outline:'none',marginBottom:18}}
          />

          {isStory && <>
            <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>Cover image</label>
            <div style={{border:'1.5px dashed #d6cab2',borderRadius:16,padding:30,textAlign:'center',background:'#faf6ec',marginBottom:18,cursor:'pointer'}}>
              <div style={{width:44,height:44,borderRadius:13,background:'#efe7d7',margin:'0 auto 10px',display:'flex',alignItems:'center',justifyContent:'center',color:'#9a7a2c',fontSize:22}}>↑</div>
              <div style={{fontSize:13.5,color:'#6f675a',fontWeight:600}}>Drag an image or tap to upload</div>
              <div style={{fontSize:11.5,color:'#a89d88',marginTop:3}}>JPG or PNG · up to 5 MB</div>
            </div>
            <div style={{display:'flex',gap:12,marginBottom:18}}>
              <div style={{flex:1}}>
                <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>Expires after</label>
                <CustomSelect
                  value={st.adminExpiry||'24 hours'}
                  options={['24 hours','48 hours','1 week']}
                  onChange={v=>this.setState({adminExpiry:v})}
                />
              </div>
              <div style={{flex:1}}>
                <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>Link button</label>
                <CustomSelect
                  value={st.adminLink||'None'}
                  options={['None','View schedule','Register','Learn more']}
                  onChange={v=>this.setState({adminLink:v})}
                  muted={!st.adminLink||st.adminLink==='None'}
                />
              </div>
            </div>
          </>}

          {isClass && (
            <div style={{display:'flex',gap:12,marginBottom:18}}>
              <div style={{flex:1}}>
                <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>Category</label>
                <CustomSelect
                  value={st.adminCat||'Food'}
                  options={['Food','Butcher','Travel','Education','Services']}
                  onChange={v=>this.setState({adminCat:v})}
                />
              </div>
              <div style={{flex:1}}>
                <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>Location</label>
                <input placeholder="City" style={{width:'100%',border:'1px solid #e6dcc8',background:'#fffdf9',borderRadius:13,padding:'13px 15px',fontSize:15,color:'#2c2823',outline:'none'}} />
              </div>
            </div>
          )}

          <label style={{display:'block',fontSize:12.5,fontWeight:600,color:'#6f675a',marginBottom:7}}>{isStory?'Story text':isClass?'Business description':'Content'}</label>
          <textarea
            value={st.adminContent}
            onChange={e=>this.setState({adminContent:e.target.value})}
            placeholder="Write the content here…"
            style={{width:'100%',minHeight:120,border:'1px solid #e6dcc8',background:'#fffdf9',borderRadius:13,padding:'13px 15px',fontSize:15,lineHeight:1.6,color:'#2c2823',outline:'none',resize:'none',marginBottom:22}}
          />

          {(st.adminTitle || st.adminContent) && (
            <div style={{marginBottom:22}}>
              <div style={{fontSize:11,letterSpacing:1.2,textTransform:'uppercase',fontWeight:700,color:'#b1a690',marginBottom:10}}>Preview</div>
              <div style={{background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:16,padding:16}}>
                <div style={{fontFamily:'Spectral,serif',fontSize:17,fontWeight:600,color:'#2c2823'}}>{st.adminTitle || 'Untitled'}</div>
                {st.adminContent && <div style={{fontSize:13,color:'#7a7264',marginTop:6,lineHeight:1.5}}>{st.adminContent}</div>}
              </div>
            </div>
          )}

          {!st.adminTitle && !st.adminContent && (
            <div style={{background:'#fffdf9',border:'1px solid #ece4d4',borderRadius:16,padding:16,marginBottom:22}}>
              <div style={{fontFamily:'Spectral,serif',fontSize:17,fontWeight:600,color:'#9a8f7c'}}>Preview appears here</div>
              <div style={{fontSize:13,color:'#b1a690',marginTop:6,lineHeight:1.5}}>Fill in the fields above to see a live preview.</div>
            </div>
          )}

          <div style={{display:'flex',gap:11,marginBottom:12}}>
            <div onClick={handlePublish} style={{flex:1,textAlign:'center',padding:14,borderRadius:14,background:canPublish?'#1f5145':'#b3a890',color:'#fffdf9',fontSize:14.5,fontWeight:600,cursor:'pointer'}}>Publish now</div>
            <div onClick={handleDraft} style={{flex:1,textAlign:'center',padding:14,borderRadius:14,border:'1px solid #e6dcc8',background:'#fffdf9',color:'#3f3a32',fontSize:14.5,fontWeight:600,cursor:'pointer'}}>Save draft</div>
          </div>
          <div onClick={()=>this.go('admin')} style={{textAlign:'center',padding:13,fontSize:13.5,color:'#9a8f7c',fontWeight:600,cursor:'pointer'}}>Cancel</div>
        </div>
      </div>
    );
  }

  /* ── STORY VIEWER ── */
  renderStoryViewer(st) {
    const cur = STORIES[st.story] || {};
    const bars = STORIES.map((_,i) => ({
      fill: i < st.story ? 100 : i===st.story ? st.storyProg : 0
    }));
    return (
      <div style={{position:'absolute',inset:0,zIndex:20,background:cur.color||'#1f5145',display:'flex',flexDirection:'column'}} className="apo">
        <div style={{position:'absolute',inset:0,background:'radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.1),rgba(0,0,0,.35))'}} />
        <div style={{position:'absolute',right:-50,bottom:-30,width:220,height:220,borderRadius:'50%',border:'1px solid rgba(255,255,255,.1)'}} />

        <div style={{position:'relative',zIndex:2,display:'flex',gap:5,padding:'54px 16px 0'}}>
          {bars.map((b,i) => (
            <div key={i} style={{flex:1,height:3,borderRadius:3,background:'rgba(255,255,255,.3)',overflow:'hidden'}}>
              <div style={{height:'100%',width:`${b.fill}%`,background:'#fff',borderRadius:3,transition:b.fill>0&&b.fill<100?'width .06s linear':'none'}} />
            </div>
          ))}
        </div>

        <div style={{position:'relative',zIndex:2,display:'flex',alignItems:'center',justifyContent:'space-between',padding:'16px 18px 0'}}>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{width:34,height:34,borderRadius:'50%',background:'rgba(255,255,255,.18)',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'Spectral,serif',color:'#fff',fontWeight:600}}>ا</div>
            <div>
              <div style={{fontSize:13.5,fontWeight:600,color:'#fff'}}>Ahlul Bayt Ireland</div>
              <div style={{fontSize:11,color:'rgba(255,255,255,.7)'}}>{cur.tag}</div>
            </div>
          </div>
          <div onClick={this.closeStory} style={{width:34,height:34,display:'flex',alignItems:'center',justifyContent:'center',cursor:'pointer',color:'#fff',fontSize:24,lineHeight:1}}>×</div>
        </div>

        <div onClick={this.prevStory} style={{position:'absolute',left:0,top:130,bottom:0,width:'35%',zIndex:3}} />
        <div onClick={this.nextStory} style={{position:'absolute',right:0,top:130,bottom:0,width:'65%',zIndex:3}} />

        <div style={{position:'relative',zIndex:2,flex:1,display:'flex',flexDirection:'column',justifyContent:'flex-end',padding:'0 26px 40px',pointerEvents:'none'}}>
          <div style={{fontFamily:'Amiri,serif',fontSize:30,color:'rgba(255,255,255,.85)',marginBottom:14}} dir="rtl">ﷺ</div>
          <div style={{fontFamily:'Spectral,serif',fontSize:30,fontWeight:600,color:'#fff',lineHeight:1.2}}>{cur.title}</div>
          <div style={{fontSize:14,color:'rgba(255,255,255,.85)',marginTop:4,fontWeight:500}}>{cur.sub}</div>
          <div style={{fontSize:15.5,color:'rgba(255,255,255,.92)',marginTop:16,lineHeight:1.6}}>{cur.body}</div>
          {cur.link && (
            <div style={{pointerEvents:'auto',display:'inline-flex',alignSelf:'flex-start',alignItems:'center',gap:8,marginTop:22,padding:'12px 20px',borderRadius:13,background:'#fff',color:'#27241f',fontSize:14,fontWeight:600,cursor:'pointer'}}>
              {cur.link} <span style={{fontSize:16}}>→</span>
            </div>
          )}
        </div>
      </div>
    );
  }

  /* ── BOTTOM NAV ── */
  renderNav(st) {
    const items = [
      { key:'home',    label:'Home',    d:NAV_ICONS.home },
      { key:'prayer',  label:'Prayer',  d:NAV_ICONS.prayer },
      { key:'library', label:'Library', d:NAV_ICONS.library },
      { key:'stories', label:'Updates', d:NAV_ICONS.stories },
      { key:'more',    label:'More',    d:NAV_ICONS.more },
    ];
    return (
      <div style={{flexShrink:0,background:'rgba(255,253,249,.92)',backdropFilter:'blur(14px)',borderTop:'1px solid #eadfca',padding:'9px 14px 26px',display:'flex',justifyContent:'space-between',zIndex:10}}>
        {items.map(n => {
          const active = n.key===st.screen || (n.key==='library' && st.screen==='reading');
          const color = active ? '#1f5145' : '#b3a890';
          return (
            <div key={n.key} onClick={()=>n.key==='stories'?this.openStory(0):this.go(n.key)} style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:4,cursor:'pointer',padding:'3px 0'}}>
              <div style={{width:24,height:24,color}}>
                <svg style={{width:'100%',height:'100%'}} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round" dangerouslySetInnerHTML={{__html:n.d}} />
              </div>
              <div style={{fontSize:10.5,fontWeight:active?700:500,color,letterSpacing:.2}}>{n.label}</div>
            </div>
          );
        })}
      </div>
    );
  }

  /* ── TOAST ── */
  renderToast(msg) {
    return (
      <div style={{position:'absolute',top:20,left:'50%',transform:'translateX(-50%)',zIndex:50,pointerEvents:'none',animation:'toast-in .25s ease both'}}>
        <div style={{background:'#1c1a17',color:'#f3ead4',fontSize:13.5,fontWeight:600,padding:'11px 20px',borderRadius:30,boxShadow:'0 8px 24px rgba(0,0,0,.3)',whiteSpace:'nowrap'}}>
          {msg}
        </div>
      </div>
    );
  }

  /* ── MAIN RENDER ── */
  render() {
    const st = this.state;
    const { next, cd } = this.computeNext();
    const now = st.now;
    const hour = now.getHours();
    const greg = now.toLocaleDateString('en-IE', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
    const hijri = toHijri(now);
    const salaam = (hour<12?'Good morning':hour<18?'Good afternoon':'Good evening') + ' · السلام عليكم';

    const showNav = st.screen!=='reading' && st.story===null && st.screen!=='adminForm';

    return (
      <div className="app">
        <div className="s" style={{flex:'1 1 auto',overflowY:'auto',overflowX:'hidden',position:'relative'}}>
          {st.screen==='home'       && this.renderHome(st, next, cd, greg, hijri, salaam)}
          {st.screen==='prayer'     && this.renderPrayer(st, next, cd, greg)}
          {st.screen==='library'    && this.renderLibrary(st)}
          {st.screen==='reading'    && this.renderReading(st)}
          {st.screen==='classifieds'&& this.renderClassifieds(st)}
          {st.screen==='more'       && this.renderMore(st)}
          {st.screen==='about'      && this.renderAbout()}
          {st.screen==='offline'    && this.renderOffline()}
          {st.screen==='admin'      && this.renderAdmin()}
        </div>
        {showNav && this.renderNav(st)}
        {st.story !== null && this.renderStoryViewer(st)}
        {st.screen==='adminForm' && this.renderAdminForm(st)}
        {st.toast && this.renderToast(st.toast)}
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
